[project]
name = "transcribe-agent"
version = "0.1.0"
description = "Transcribe distributed worker agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "qwen-asr",
    "torch",
    "huggingface-hub",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

