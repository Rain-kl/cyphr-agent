[project]
name = "cyphr-agent"
version = "0.1.0"
description = "Distributed Python inference agent for Cyphr transcription platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "qwen-asr",
    "torch",
    "huggingface-hub",
    "vllm>=0.8.0",
    "numpy",
    "soundfile>=0.14.0",
    "nvidia-ml-py>=13.610.43",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "pylint>=4.0.8",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "models",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, variables, etc.)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern Python 3.12 syntax)
    "B",      # flake8-bugbear (common pitfalls and bug patterns)
    "C4",     # flake8-comprehensions (clean comprehensions)
    "SIM",    # flake8-simplify (simplify code structure)
    "RET",    # flake8-return (return statement consistency)
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security checks)
    "PLR2004", # magic-value-comparison (魔法值检测)
]
ignore = [
    "E501",   # line-too-long (handled by ruff format)
    "SIM105", # try-except-pass vs contextlib.suppress
    "S108",   # allow /tmp/ paths
    "S110",   # try-except-pass detected (best-effort cleanups/fallbacks)
    "RUF006", # asyncio.create_task without reference
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S",       # allow all bandit checks in tests (asserts, mock passwords, etc.)
    "PLR2004", # allow magic numbers in tests
    "RET504",  # allow variable assignment before return in tests
    "RET505",  # allow elif after return in tests
    "B904",    # allow raise without from in tests
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["str", "bytes"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pylint.main]
ignore = [".git", ".venv", "models", "tests"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
